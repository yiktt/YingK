<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">YingK：一个安静、克制的 Typecho 单栏博客主题</title>
  <desc id="hero-desc">浅色背景上的白色玻璃卡片，卡内有蓝紫渐变头像圆、主题名 YingK 与定位句“一个安静、克制的 Typecho 单栏博客主题”，配色取自主题自身。</desc>
  <defs>
    <radialGradient id="orb" cx="0.32" cy="0.24" r="0.9">
      <stop offset="0" stop-color="#5F75E3"/>
      <stop offset="1" stop-color="#BCA7CD"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="26" fill="#fafafa"/>

  <circle cx="1062" cy="-52" r="248" fill="#BCA7CD" opacity="0.34"/>
  <circle cx="-72" cy="304" r="216" fill="#5F75E3" opacity="0.20"/>
  <circle cx="616" cy="-120" r="180" fill="#5F75E3" opacity="0.10"/>

  <rect x="60" y="70" width="1080" height="190" rx="28" fill="#24292e" opacity="0.05"/>
  <rect x="60" y="64" width="1080" height="190" rx="28" fill="#ffffff" opacity="0.92" stroke="#e8e8e8"/>

  <g id="avatar-orb">
    <rect x="96" y="108" width="72" height="72" rx="18" fill="url(#orb)"/>
    <circle cx="132" cy="132" r="13.5" fill="#ffffff" opacity="0.92"/>
    <path d="M109 162 a23 23 0 0 1 46 0 z" fill="#ffffff" opacity="0.92"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <text x="204" y="158" font-size="64" font-weight="700" letter-spacing="2" fill="#24292e">YingK</text>
    <text x="204" y="206" font-size="26" fill="#586069">一个安静、克制的 Typecho 单栏博客主题。</text>
  </g>
</svg>
